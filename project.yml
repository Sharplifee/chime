name: Chyme
options:
  bundleIdPrefix: com.connor
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: XF783932R2
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO

targets:
  Chyme:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    sources: [App, Shared, Engine, Connect, Alarm]
    info:
      path: Config/Chyme-Info.plist
      properties:
        CFBundleDisplayName: Chyme
        UILaunchScreen: {}
        NSAlarmKitUsageDescription: "Chyme schedules your alarms and timers so they ring reliably and stop on their own."
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    entitlements:
      path: Config/Chyme.entitlements
      properties:
        com.apple.security.application-groups: [group.com.connor.chyme]
    dependencies:
      - target: ChymeWidgets
        embed: true
      - target: ChymeWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.chyme

  ChymeWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared, Alarm]
    info:
      path: Config/ChymeWidgets-Info.plist
      properties:
        CFBundleDisplayName: Chyme
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/ChymeWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.connor.chyme]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.chyme.widgets

  ChymeWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared, Connect]
    info:
      path: Config/ChymeWatch-Info.plist
      properties:
        CFBundleDisplayName: Chyme
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.connor.chyme
        WKRunsIndependentlyOfCompanionApp: true
    entitlements:
      path: Config/ChymeWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.connor.chyme]
    dependencies:
      - target: ChymeWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.chyme.watchkitapp

  ChymeWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [WatchWidgets, Shared]
    info:
      path: Config/ChymeWatchWidgets-Info.plist
      properties:
        CFBundleDisplayName: Chyme
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/ChymeWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.connor.chyme]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.chyme.watchkitapp.widgets
