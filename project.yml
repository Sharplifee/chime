name: Chime
options:
  bundleIdPrefix: com.connor
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: XF783932R2
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO

targets:
  Chime:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    sources: [App, Shared, Engine, Connect, Alarm]
    info:
      path: Config/Chime-Info.plist
      properties:
        CFBundleDisplayName: Chime
        UILaunchScreen: {}
        NSAlarmKitUsageDescription: "Chime schedules your alarms and timers so they ring reliably and stop on their own."
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    entitlements:
      path: Config/Chime.entitlements
      properties:
        com.apple.security.application-groups: [group.com.connor.chime]
    dependencies:
      - target: ChimeWidgets
        embed: true
      - target: ChimeWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.chime

  ChimeWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared, Alarm]
    info:
      path: Config/ChimeWidgets-Info.plist
      properties:
        CFBundleDisplayName: Chime
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/ChimeWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.connor.chime]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.chime.widgets

  ChimeWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared, Connect]
    info:
      path: Config/ChimeWatch-Info.plist
      properties:
        CFBundleDisplayName: Chime
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.connor.chime
        WKRunsIndependentlyOfCompanionApp: true
    entitlements:
      path: Config/ChimeWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.connor.chime]
    dependencies:
      - target: ChimeWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.chime.watchkitapp

  ChimeWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [WatchWidgets, Shared]
    info:
      path: Config/ChimeWatchWidgets-Info.plist
      properties:
        CFBundleDisplayName: Chime
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/ChimeWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.connor.chime]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.chime.watchkitapp.widgets
