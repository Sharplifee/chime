name: Build Chime

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcodes and SDKs
        run: |
          ls -1 /Applications | grep -i '^Xcode' || true
          xcodebuild -version
          xcodebuild -showsdks | sed -n '1,60p'

      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: List schemes
        run: xcodebuild -list -project Chime.xcodeproj

      - name: Build iOS (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Chime.xcodeproj \
            -scheme Chime \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/build.log | grep -E "error:|warning:|BUILD" || true
          echo "--- full error context ---"
          grep -B2 -A6 "error:" /tmp/build.log | head -120 || true
          grep -q "BUILD SUCCEEDED" /tmp/build.log
